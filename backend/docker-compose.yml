services:

  mysql:
    image: mysql:8.0
    container_name: taskflow-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: taskflow_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - taskflow-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  eureka-server:
    image: taskflow-eureka-server:1.0
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - taskflow-network

  user-service:
    image: taskflow-user-service:1.0
    container_name: taskflow-user-service
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/taskflow_db
      DB_USERNAME: root
      DB_PASSWORD: root
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 3600000
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - taskflow-network

  project-service:
    image: taskflow-project-service:1.0
    container_name: taskflow-project-service
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/taskflow_db
      DB_USERNAME: root
      DB_PASSWORD: root
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - taskflow-network

  task-service:
    image: taskflow-task-service:1.0
    container_name: taskflow-task-service
    ports:
      - "8083:8083"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/taskflow_db
      DB_USERNAME: root
      DB_PASSWORD: root
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - taskflow-network

  notification-service:
    image: taskflow-notification-service:1.0
    container_name: taskflow-notification-service
    ports:
      - "8084:8084"
    environment:
      DB_URL: "jdbc:mysql://taskflow-mysql:3306/taskflow_db"
      DB_USERNAME: "root"
      DB_PASSWORD: "root"
      EUREKA_URL: "http://eureka-server:8761/eureka/"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - taskflow-network

  api-gateway:
    image: taskflow-api-gateway:1.0
    container_name: taskflow-api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      eureka-server:
        condition: service_started
      user-service:
        condition: service_started
      project-service:
        condition: service_started
      task-service:
        condition: service_started
      notification-service:
        condition: service_started
    networks:
      - taskflow-network

networks:
  taskflow-network:
    driver: bridge

volumes:
  mysql_data: